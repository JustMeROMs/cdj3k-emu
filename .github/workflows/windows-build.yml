name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ "windows-port", "main" ]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  guest-assets:
    name: Prepare Linux guest assets
    runs-on: ubuntu-latest
    outputs:
      source_key: ${{ steps.guest-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute guest source key
        id: guest-key
        shell: bash
        run: echo "key=$(python3 scripts/guest-source-key.py)" >> "$GITHUB_OUTPUT"

      - name: Restore guest resource cache
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: guest-resources
          key: guest-resources-v2-${{ steps.guest-key.outputs.key }}

      # Alpha 5 bootstrap: the Alpha 4.1 run already produced known-good guest
      # resources from exactly this guest source tree. Reuse that artifact once
      # to seed the new content-keyed cache instead of rebuilding Linux for 4h.
      - name: Bootstrap guest resources from previous successful artifact
        id: bootstrap
        if: steps.guest-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_KEY: ${{ steps.guest-key.outputs.key }}
        run: |
          set -euo pipefail
          APPROVED_KEY="$(cat windows/guest-resources-bootstrap-key.txt)"
          if [ "$ACTUAL_KEY" != "$APPROVED_KEY" ]; then
            echo "Guest source changed; refusing stale artifact bootstrap."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Guest source matches Alpha 4.1; looking for previous artifact..."
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=cdj3k-emu-guest-resources&per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api" > artifacts.json
          artifact_id="$(jq -r --arg current "$GITHUB_RUN_ID" '
            [.artifacts[] | select(.expired == false) | select((.workflow_run.id|tostring) != $current)]
            | sort_by(.created_at) | reverse | .[0].id // empty
          ' artifacts.json)"
          if [ -z "$artifact_id" ]; then
            echo "No reusable guest artifact found; a full guest build is required."
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o guest.zip
          rm -rf guest-resources
          mkdir -p guest-resources
          unzip -q guest.zip -d guest-resources
          if [ -f guest-resources/guest-resources/Image ] && [ ! -f guest-resources/Image ]; then
            cp -a guest-resources/guest-resources/. guest-resources/
            rm -rf guest-resources/guest-resources
          fi
          test -f guest-resources/Image
          test -f guest-resources/tools/ep122_shim.so
          test -f guest-resources/patch/patch-rootfs.sh
          echo "Reused artifact ${artifact_id}; guest cache will be seeded at job completion."
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true' && steps.bootstrap.outputs.bootstrapped != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true' && steps.bootstrap.outputs.bootstrapped != 'true'

      - name: Build ARM64 guest assets
        if: steps.guest-cache.outputs.cache-hit != 'true' && steps.bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -eux
          rm -rf guest-assets-out
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --target artifacts \
            --output type=local,dest=guest-assets-out \
            -f docker/Dockerfile .

      - name: Stage freshly built guest resources
        if: steps.guest-cache.outputs.cache-hit != 'true' && steps.bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -eux
          rm -rf guest-resources
          mkdir -p guest-resources/modules guest-resources/tools guest-resources/patch
          cp guest-assets-out/Image guest-resources/Image
          cp guest-assets-out/modules/*.ko guest-resources/modules/
          cp guest-assets-out/ep122_shim.so guest-resources/tools/
          cp guest-assets-out/subucom_forwarder_aarch64 guest-resources/tools/
          cp guest-assets-out/subucom_live_aarch64 guest-resources/tools/
          cp guest-assets-out/cfgd_aarch64 guest-resources/tools/
          cp guest-assets-out/stemd_client_aarch64 guest-resources/tools/
          cp -R initramfs-patch/. guest-resources/patch/
          cp guest-assets-out/dummy_drv.so guest-resources/patch/dummy_drv.so
          mkdir -p guest-resources/patch/vanilla-modules
          cp guest-assets-out/modules/*.ko guest-resources/patch/vanilla-modules/

      - name: Verify guest resources
        shell: bash
        run: |
          set -eux
          test -f guest-resources/Image
          test -f guest-resources/tools/ep122_shim.so
          test -f guest-resources/tools/cfgd_aarch64
          test -f guest-resources/patch/patch-rootfs.sh
          find guest-resources -maxdepth 3 -type f -print | sort

      - uses: actions/upload-artifact@v4
        with:
          name: cdj3k-emu-guest-resources
          path: guest-resources/
          retention-days: 14

  qemu-windows:
    name: Build patched Windows QEMU
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore patched QEMU runtime cache
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: qemu/windows-out
          key: qemu-windows-v1-${{ hashFiles('qemu/build-windows.sh', 'qemu/patches/**') }}

      - name: Install MSYS2 MinGW64 build environment
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            diffutils
            patch
            perl
            python
            ninja
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-capstone
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-gettext

      # Alpha 5.2: deliberately build without libslirp for now.
      # The MSYS2 MINGW64 repository used by GitHub runners does not reliably
      # expose mingw-w64-x86_64-libslirp. Networking is a later milestone and
      # must not block the core Windows QEMU build.

      - name: Build patched QEMU for Windows
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash qemu/build-windows.sh

      - name: Verify patched QEMU runtime
        shell: pwsh
        run: |
          @(
            'qemu/windows-out/qemu-system-aarch64.exe',
            'qemu/windows-out/qemu-img.exe',
            'qemu/windows-out/README-QEMU-WINDOWS.txt'
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing Windows QEMU runtime file: $_" }
          }
          & qemu/windows-out/qemu-system-aarch64.exe --version
          & qemu/windows-out/qemu-img.exe --version
          Get-ChildItem qemu/windows-out | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: cdj3k-emu-windows-qemu
          path: qemu/windows-out/
          retention-days: 14

  windows:
    name: Build Windows frontend
    needs: [guest-assets, qemu-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Windows firmware provisioning tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            bash
            coreutils
            findutils
            cpio
            sed
            grep
            gawk
            gzip
            tar
            util-linux

      - name: Verify bundled provisioning tools
        shell: msys2 {0}
        run: |
          set -eux
          bash --version | head -n 1
          cpio --version | head -n 1
          find --version | head -n 1
          command -v bash
          command -v cpio
          command -v find

      - name: Cargo check workspace
        run: cargo check --workspace
      - name: Build Windows app
        run: cargo build --release -p cdj3k-emu

      - uses: actions/download-artifact@v4
        with:
          name: cdj3k-emu-guest-resources
          path: guest-resources
      - uses: actions/download-artifact@v4
        with:
          name: cdj3k-emu-windows-qemu
          path: qemu-runtime

      - name: Stage app, guest resources, QEMU and provisioning tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/cdj3k-emu.exe dist/
          Copy-Item windows/README-WINDOWS.md dist/
          Copy-Item WINDOWS_PORT_STATUS.md dist/
          Copy-Item -Recurse guest-resources dist/resources

          # Patched Windows QEMU backend.
          New-Item -ItemType Directory -Force dist/qemu | Out-Null
          Copy-Item -Recurse qemu-runtime/* dist/qemu/
          # qemu-img is also copied beside the app for compatibility with older
          # helper lookup code and troubleshooting from Command Prompt.
          Copy-Item dist/qemu/qemu-img.exe dist/qemu-img.exe

          # Firmware provisioning Unix userland.
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          if (-not $msysRoot) { throw "setup-msys2 did not report an installation path" }
          New-Item -ItemType Directory -Force dist/resources/msys2/usr | Out-Null
          Copy-Item -Recurse "$msysRoot/usr/bin" dist/resources/msys2/usr/bin
          if (Test-Path "$msysRoot/usr/share/terminfo") {
            New-Item -ItemType Directory -Force dist/resources/msys2/usr/share | Out-Null
            Copy-Item -Recurse "$msysRoot/usr/share/terminfo" dist/resources/msys2/usr/share/terminfo
          }

          @(
            'dist/cdj3k-emu.exe',
            'dist/qemu/qemu-system-aarch64.exe',
            'dist/qemu/qemu-img.exe',
            'dist/qemu-img.exe',
            'dist/resources/Image',
            'dist/resources/msys2/usr/bin/bash.exe',
            'dist/resources/msys2/usr/bin/cpio.exe'
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Final Windows package missing: $_" }
          }

          @'
          @echo off
          echo CDJ3K Emulator Windows QEMU self-test
          echo.
          qemu\qemu-system-aarch64.exe --version
          if errorlevel 1 goto :fail
          qemu\qemu-img.exe --version
          if errorlevel 1 goto :fail
          echo.
          echo PASS: patched QEMU runtime can start.
          pause
          exit /b 0
          :fail
          echo.
          echo FAIL: QEMU runtime could not start. Take a screenshot of this window.
          pause
          exit /b 1
          '@ | Set-Content -Encoding ASCII dist/QEMU-SELFTEST.bat

          @'
          @echo off
          setlocal EnableExtensions
          title CDJ3K Emulator Alpha 6.5 Host Integration Self-Test
          cd /d "%~dp0"

          echo ============================================================
          echo CDJ3K Emulator Alpha 6.5 - NO-KEY Host Integration Self-Test
          echo ============================================================
          echo.
          echo This test does NOT need Pioneer firmware or an AES key.
          echo It checks the Windows host runtime we can develop right now.
          echo.

          set FAIL=0

          call :checkfile "cdj3k-emu.exe"
          call :checkfile "qemu\qemu-system-aarch64.exe"
          call :checkfile "qemu\qemu-img.exe"
          call :checkfile "resources\Image"
          call :checkfile "resources\msys2\usr\bin\bash.exe"
          call :checkfile "resources\msys2\usr\bin\cpio.exe"
          call :checkfile "resources\msys2\usr\bin\find.exe"
          call :checkfile "resources\msys2\usr\bin\gzip.exe"

          echo.
          echo [TEST] QEMU ARM64 version...
          qemu\qemu-system-aarch64.exe --version
          if errorlevel 1 (
            echo [FAIL] qemu-system-aarch64.exe could not run
            set FAIL=1
          ) else (
            echo [PASS] QEMU executable starts
          )

          echo.
          echo [TEST] qemu-img version...
          qemu\qemu-img.exe --version
          if errorlevel 1 (
            echo [FAIL] qemu-img.exe could not run
            set FAIL=1
          ) else (
            echo [PASS] qemu-img executable starts
          )

          echo.
          echo [TEST] Custom shared-memory display backend registration...
          qemu\qemu-system-aarch64.exe -display help 2>&1 | findstr /I /C:"shm" >nul
          if errorlevel 1 (
            echo [FAIL] QEMU did not advertise the custom "shm" display backend
            set FAIL=1
          ) else (
            echo [PASS] Custom "shm" display backend is registered
          )

          echo.
          echo [TEST] TCG ARM64 virtual machine startup...
          set TESTLOG=%TEMP%\cdj3k-qemu-host-selftest.log
          del /q "%TESTLOG%" >nul 2>&1
          start "" /b qemu\qemu-system-aarch64.exe ^
            -machine virt ^
            -accel tcg ^
            -cpu cortex-a72 ^
            -m 128 ^
            -nodefaults ^
            -display none ^
            -monitor none ^
            -serial none ^
            -S >"%TESTLOG%" 2>&1

          timeout /t 3 /nobreak >nul
          tasklist /FI "IMAGENAME eq qemu-system-aarch64.exe" | find /I "qemu-system-aarch64.exe" >nul
          if errorlevel 1 (
            echo [FAIL] ARM64 TCG VM did not stay running
            echo.
            if exist "%TESTLOG%" type "%TESTLOG%"
            set FAIL=1
          ) else (
            echo [PASS] ARM64 TCG VM starts and stays alive
            taskkill /IM qemu-system-aarch64.exe /F >nul 2>&1
          )

          echo.
          echo [TEST] Writable runtime directory...
          set TESTDIR=%TEMP%\cdj3k-alpha65-selftest
          rmdir /s /q "%TESTDIR%" >nul 2>&1
          mkdir "%TESTDIR%" >nul 2>&1
          echo ok>"%TESTDIR%\write-test.txt"
          if exist "%TESTDIR%\write-test.txt" (
            echo [PASS] Windows temp/runtime directory is writable
          ) else (
            echo [FAIL] Could not write to Windows temp/runtime directory
            set FAIL=1
          )
          rmdir /s /q "%TESTDIR%" >nul 2>&1

          echo.
          echo ============================================================
          if "%FAIL%"=="0" (
            echo PASS: Alpha 6.5 host integration checks all passed.
            echo We can keep developing Windows/QEMU integration without
            echo the proprietary firmware decryption key.
          ) else (
            echo FAIL: One or more host integration checks failed.
            echo Take a screenshot of this window and send it back.
          )
          echo ============================================================
          echo.
          pause
          exit /b %FAIL%

          :checkfile
          if exist %1 (
            echo [PASS] Found %~1
          ) else (
            echo [FAIL] Missing %~1
            set FAIL=1
          )
          exit /b 0
          '@ | Set-Content -Encoding ASCII dist/WINDOWS-HOST-SELFTEST.bat

          @'
          ALPHA 6.5 - NO-KEY DEVELOPMENT BUILD

          You do not need a CDJ-3000 AES/decryption key to run the host tests.

          Run these first:
            QEMU-SELFTEST.bat
            WINDOWS-HOST-SELFTEST.bat

          WINDOWS-HOST-SELFTEST checks:
            - packaged Windows executable
            - QEMU + qemu-img
            - guest kernel resource
            - bundled provisioning tools
            - custom shm display backend registration
            - ARM64 TCG virtual machine startup
            - writable Windows runtime directory

          Firmware installation still correctly requires a compatible key.
          This build does not bypass, derive, or include that key.
          '@ | Set-Content -Encoding ASCII dist/README-ALPHA6.5-NO-KEY.txt

          
          @'
          @echo off
          title CDJ3K Emulator Alpha 7.1 App-to-QEMU Integration Test
          cd /d "%~dp0"
          echo ============================================================
          echo CDJ3K Emulator Alpha 7.1 - APP TO QEMU GRAPHICS TEST
          echo ============================================================
          echo.
          echo No Pioneer firmware or AES key is required.
          echo.
          cdj3k-emu.exe --windows-host-test
          set RC=%ERRORLEVEL%
          echo.
          if "%RC%"=="0" (
            echo PASS: app-to-QEMU integration test succeeded.
          ) else (
            echo FAIL: app-to-QEMU integration test failed.
            echo Take a screenshot of this window and send it back.
          )
          echo.
          pause
          exit /b %RC%
          '@ | Set-Content -Encoding ASCII dist/APP-QEMU-SELFTEST.bat

          Write-Host "Final Windows Alpha 7.1 package:"
          Get-ChildItem -Recurse dist | Select-Object FullName,Length

      - uses: actions/upload-artifact@v4
        with:
          name: cdj3k-emu-windows-alpha7.1
          path: dist/
          retention-days: 14
